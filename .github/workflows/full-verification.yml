name: Full verification

# The Python suite on macOS 15, the second platform the exit criteria name. A macOS minute is billed
# as ten Linux minutes, so it runs only where cross-platform evidence is needed: on a pull request
# labelled full-ci (a final integration pull request), when labelled and on every later event while it
# keeps the label; on a release candidate tag (v*); or by hand (workflow_dispatch). On any other pull
# request the job is skipped, using no runner, and its check reports success.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  UV_VERSION: "0.11.32"

jobs:
  python:
    name: python (macos-15)  # the name its check had in CI
    # Every event of a labelled pull request runs it, another label's included: a skipped run on the
    # same commit would hide the result of the one before.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: macos-15
    timeout-minutes: 30
    # Here, not on the workflow, so that a skipped run never cancels a running one.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run pytest -q
